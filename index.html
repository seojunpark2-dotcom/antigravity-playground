<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Antigravity Playground 🚀</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --border: rgba(255, 255, 255, 0.1);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f172a 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Pretendard', sans-serif;
      color: var(--text);
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px;
      max-width: 540px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(99, 102, 241, 0.15);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    h1 {
      font-size: 2.25rem;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #ffffff 30%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .interactive-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 28px;
    }

    .counter-display {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 16px;
      font-variant-numeric: tabular-nums;
    }

    .btn-group {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    button:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    button.btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    button.btn-outline:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.3);
      box-shadow: none;
    }

    .quote-box {
      font-size: 0.95rem;
      color: #cbd5e1;
      font-style: italic;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 16px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
    }

    footer {
      margin-top: 24px;
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .vercel-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--text);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="badge">
      <div class="badge-dot"></div>
      Vercel 배포 준비 완료
    </div>

    <h1>Antigravity Playground</h1>
    <p class="subtitle">
      클라우드에 즉시 배포 가능한 인터랙티브 모던 웹사이트입니다.
    </p>

    <div class="interactive-card">
      <div class="counter-display" id="counter">0</div>
      <div class="btn-group">
        <button id="incrementBtn">⚡ 클릭 카운트</button>
        <button id="quoteBtn" class="btn-outline">✨ 메시지 뽑기</button>
      </div>
      <div class="quote-box" id="quoteText">
        "상상하는 모든 소프트웨어가 현실이 됩니다."
      </div>
    </div>

    <footer>
      <span>배포 준비:</span>
      <span class="vercel-badge">▲ Vercel Ready</span>
      <span>•</span>
      <span id="currentTime"></span>
    </footer>
  </main>

  <script>
    let count = 0;
    const counterEl = document.getElementById('counter');
    const incrementBtn = document.getElementById('incrementBtn');
    const quoteBtn = document.getElementById('quoteBtn');
    const quoteText = document.getElementById('quoteText');
    const timeEl = document.getElementById('currentTime');

    const quotes = [
      "상상하는 모든 소프트웨어가 현실이 됩니다.",
      "Vercel과 함께 전 세계 어디서든 초고속 로딩을 경험하세요.",
      "작은 아이디어가 위대한 서비스를 만듭니다.",
      "Antigravity와 함께 새로운 차원의 코딩을 시작해보세요!",
      "Simple is better than complex."
    ];

    incrementBtn.addEventListener('click', () => {
      count++;
      counterEl.textContent = count;
      counterEl.style.transform = 'scale(1.15)';
      setTimeout(() => counterEl.style.transform = 'scale(1)', 150);
    });

    quoteBtn.addEventListener('click', () => {
      const randomIndex = Math.floor(Math.random() * quotes.length);
      quoteText.textContent = `"${quotes[randomIndex]}"`;
    });

    function updateTime() {
      const now = new Date();
      timeEl.textContent = now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }
    updateTime();
    setInterval(updateTime, 1000);
  </script>
</body>
</html>
